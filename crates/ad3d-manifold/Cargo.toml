[package]
name = "ad3d-manifold"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Safe wrapper around the vendored manifold C++ library (C API), built from source with CMake"
publish = false
# One native copy of manifold per binary: cargo refuses a second crate that
# also declares `links = "manifold"` (e.g. manifold-csg-sys).
links = "manifold"
build = "build.rs"

[dependencies]

[build-dependencies]
# 0.1.58 passes -DCMAKE_OSX_ARCHITECTURES=<arch> for *-apple-darwin targets,
# which is what makes the aarch64 cross build on an Intel Mac work.
cmake = "0.1.58"

[package.metadata.vendor]
# Provenance of vendor/ (fetched by fetch-vendor.sh, which also writes vendor/VERSIONS).
manifold = { version = "3.5.4", sha256 = "db2a8e7aac6abac12fe54fa7b055d24741362b5706fee6f5c5b8f0bccd2de4ec", url = "https://github.com/elalish/manifold/releases/download/v3.5.4/manifold-3.5.4.tar.gz" }
clipper2 = { commit = "46f639177fe418f9689e8ddb74f08a870c71f5b4", sha256 = "73f5783e0c88299976334f48e3e356c756b96212c652ecc8bceec3bd99455bcb", url = "https://github.com/AngusJohnson/Clipper2/archive/46f639177fe418f9689e8ddb74f08a870c71f5b4.tar.gz" }
